
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Engineering Quiz</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl rounded-2xl shadow-lg p-6 sm:p-8">

        <h1 class="text-3xl font-bold text-center text-blue-700 mb-2">
            AI Engineering Quiz
        </h1>

        <p class="text-gray-500 text-center mb-8">
            Test your knowledge with these 3 questions.
        </p>

        <form id="quizForm">

            <!-- Question 1 -->
            <div class="mb-7">
                <h2 class="font-semibold text-lg mb-3">
                    1. What does AI stand for?
                </h2>

                <div class="space-y-2">
                    <label class="option">
                        <input type="radio" name="q1" value="a">
                        Artificial Intelligence
                    </label>

                    <label class="option">
                        <input type="radio" name="q1" value="b">
                        Automated Internet
                    </label>

                    <label class="option">
                        <input type="radio" name="q1" value="c">
                        Advanced Information
                    </label>

                    <label class="option">
                        <input type="radio" name="q1" value="d">
                        Artificial Integration
                    </label>
                </div>
            </div>

            <!-- Question 2 -->
            <div class="mb-7">
                <h2 class="font-semibold text-lg mb-3">
                    2. Which programming language is widely used in AI development?
                </h2>

                <div class="space-y-2">
                    <label class="option">
                        <input type="radio" name="q2" value="a">
                        HTML
                    </label>

                    <label class="option">
                        <input type="radio" name="q2" value="b">
                        Python
                    </label>

                    <label class="option">
                        <input type="radio" name="q2" value="c">
                        CSS
                    </label>

                    <label class="option">
                        <input type="radio" name="q2" value="d">
                        SQL
                    </label>
                </div>
            </div>

            <!-- Question 3 -->
            <div class="mb-7">
                <h2 class="font-semibold text-lg mb-3">
                    3. What is the primary purpose of Machine Learning?
                </h2>

                <div class="space-y-2">
                    <label class="option">
                        <input type="radio" name="q3" value="a">
                        Designing websites
                    </label>

                    <label class="option">
                        <input type="radio" name="q3" value="b">
                        Storing files
                    </label>

                    <label class="option">
                        <input type="radio" name="q3" value="c">
                        Learning patterns from data
                    </label>

                    <label class="option">
                        <input type="radio" name="q3" value="d">
                        Creating databases
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                Submit Quiz
            </button>

        </form>

        <!-- Result Section -->
        <div id="result" class="hidden mt-6 p-5 rounded-lg text-center bg-blue-50"
             aria-live="polite">

            <h2 class="text-2xl font-bold text-blue-700 mb-2">
                Quiz Completed!
            </h2>

            <p id="score" class="text-lg font-semibold"></p>

            <p id="percentage" class="text-gray-600 mt-1"></p>

            <p id="feedback" class="font-medium mt-3"></p>

            <button onclick="restartQuiz()"
                class="mt-5 bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg">
                Retake Quiz
            </button>

        </div>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
